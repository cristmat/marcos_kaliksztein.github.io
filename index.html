    <style>
        body {

        .banner {
            width: 100%;
            display: block;
        }

        /* Menú */
        nav {

        nav button {

            border: none;
            color: white;

        }

        main {
            padding: 30px;
        }
		
		.mapa {
			display: flex;
			justify-content: center;
		}

			width: 90%;
			max-width: 800px;
			height: 500px;
		}

</head>

<body>
	<nav>
        <button onclick="mostrar('inicio')">Inicio</button>

        <button onclick="mostrar('contactos')">Contactos</button>
    </nav>
    <img class="banner" src="banner.jpg" alt="Estudio de Arquitectura">
